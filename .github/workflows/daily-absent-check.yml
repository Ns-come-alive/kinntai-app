name: Daily absence check

# 毎日 09:00 JST（= 00:00 UTC）に当欠を自動判定する。
# 事前に GitHub リポジトリの Secrets に CRON_SECRET を登録し、
# Render 側の環境変数 CRON_SECRET にも同じ値を設定しておくこと。
# ※ GitHub Actions のスケジュールは数分〜十数分遅延することがあるが、
#   エンドポイント側は「前夜の営業日」を対象にするため遅延の影響を受けない。
#
# 既定で必ず両店舗（GIFT / BlueBell）を対象にする。
# 3店舗目以降を足したいときだけ、Variables の EXTRA_STORE_BASE_URLS に
# 追加URLをスペース/改行区切りで並べる（既定の2店舗は常に対象のまま）。
# ※ 各店舗の Render 環境変数 CRON_SECRET には同じ値を設定しておくこと。

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

env:
  # 常に対象にする店舗（変数の設定に関わらず必ず対象）
  DEFAULT_STORE_BASE_URLS: "https://kinntai-app.onrender.com https://kintai-app-bluebell.onrender.com"
  # 追加店舗があればここに足す（未設定なら何も足さない）
  EXTRA_STORE_BASE_URLS: ${{ vars.EXTRA_STORE_BASE_URLS }}

jobs:
  check-absent:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger absence check
        run: |
          failed=0
          seen=""
          for base in $DEFAULT_STORE_BASE_URLS $EXTRA_STORE_BASE_URLS; do
            base="${base%/}"
            case " $seen " in *" $base "*) continue;; esac
            seen="$seen $base"
            echo "--- $base ---"
            curl -fsSL -X POST \
              -H "X-Cron-Token: ${{ secrets.CRON_SECRET }}" \
              "$base/cron/check-absent" -w "\nHTTP %{http_code}\n" || failed=1
          done
          exit $failed
