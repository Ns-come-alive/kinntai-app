name: Keep Render warm

# 既定で必ず両店舗（GIFT / BlueBell）を温める。
# 3店舗目以降を足したいときだけ、Variables の EXTRA_STORE_BASE_URLS に
# 追加URLをスペース/改行区切りで並べる（既定の2店舗は常に対象のまま）。
#
# ※ 以前は STORE_BASE_URLS で「対象を丸ごと差し替える」方式だったが、
#   変数を設定すると既定が無視され、片方の店舗が休止してしまう事故があったため、
#   既定は常に温める方式に変更した。
#
# ※ GitHub のスケジュール実行は混雑時に10〜30分以上遅れる/飛ぶことが多く、
#   「1回の起動で1回だけping」では遅延したときにスリープ（15分無アクセス）に
#   間に合わず、Render の待機画面（コールドスタート）が出ていた。
#   そこで 1回の起動の中で 2分おきに約14分間ping し続ける「自己ブリッジ」方式にして、
#   1回の実行だけでスリープ窓（15分）をほぼ丸ごとカバーできるようにしている。

on:
  schedule:
    # 営業時間帯（20:30〜翌07:00 JST）だけ温める。それ以外は寝かせて
    # Render 無料枠（月750時間）を節約する。営業外はスリープするので
    # 初アクセス時に待機画面（コールドスタート）が出る点は許容する。
    #
    # GitHub Actions の cron は UTC 基準。JST = UTC+9 なので
    #   20:30 JST = 11:30 UTC / 翌07:00 JST = 22:00 UTC（同じUTC日内に収まる）。
    # 10分間隔で起動しつつ、各実行が内部で約14分pingし続けるので、
    # 実行同士が重なり、多少の遅延があっても隙間ができにくい。
    - cron: "30,40,50 11 * * *"   # 20:30〜20:50 JST
    - cron: "*/10 12-21 * * *"    # 21:00〜06:50 JST
    - cron: "0 22 * * *"          # 07:00 JST（締めの1回）
  workflow_dispatch:

# 遅延した実行が重なっても止めない（重なりこそが隙間対策になる）ので
# concurrency は設定しない。

env:
  # 常に温める店舗（変数の設定に関わらず必ず対象）
  DEFAULT_STORE_BASE_URLS: "https://kinntai-app.onrender.com https://kintai-app-bluebell.onrender.com"
  # 追加店舗があればここに足す（未設定なら何も足さない）
  EXTRA_STORE_BASE_URLS: ${{ vars.EXTRA_STORE_BASE_URLS }}
  # 1回の起動で ping し続ける長さ（分）と間隔（秒）
  WARM_DURATION_MIN: "14"
  WARM_INTERVAL_SEC: "120"

jobs:
  ping:
    runs-on: ubuntu-latest
    # 内部ループが約14分回る。取りこぼし対策の余裕を持って上限を置く。
    timeout-minutes: 20
    steps:
      - name: Keep warm (loop ping)
        run: |
          # 重複URLを除いた対象リストを作る
          targets=""
          seen=""
          for base in $DEFAULT_STORE_BASE_URLS $EXTRA_STORE_BASE_URLS; do
            base="${base%/}"
            case " $seen " in *" $base "*) continue;; esac
            seen="$seen $base"
            targets="$targets $base"
          done
          echo "targets:$targets"

          end=$(( $(date +%s) + WARM_DURATION_MIN * 60 ))
          round=0
          while :; do
            round=$((round + 1))
            echo "===== round $round ($(date -u +%H:%M:%S)Z) ====="
            for base in $targets; do
              # 温めるのが目的なので、失敗しても打ち切らずログだけ残して継続する。
              code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 90 "$base/healthz" || echo "000")
              echo "$base -> HTTP $code"
            done
            # 予定終了時刻を過ぎたら、最後のpingを済ませているので抜ける
            [ "$(date +%s)" -ge "$end" ] && break
            sleep "$WARM_INTERVAL_SEC"
          done
