name: Keep Render warm

# 対象店舗は Variables の STORE_BASE_URLS で指定する（スペース/改行区切り）。
# 未設定なら店舗A（既存）だけを対象にする。

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

env:
  STORE_BASE_URLS: ${{ vars.STORE_BASE_URLS || 'https://kinntai-app.onrender.com' }}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health check
        run: |
          for base in $STORE_BASE_URLS; do
            base="${base%/}"
            echo -n "$base -> "
            curl -fsSL -o /dev/null -w "HTTP %{http_code}\n" "$base/healthz" || echo "failed"
          done
