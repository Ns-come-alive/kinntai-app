name: Keep Render warm

# 対象店舗は Variables の STORE_BASE_URLS で指定する（スペース/改行区切り）。
# 未設定なら店舗A（既存）だけを対象にする。

on:
  schedule:
    # GitHub のスケジュールは混雑時に数分遅れることがあるため、
    # 15分の休止に確実に間に合うよう 10分間隔にしている。
    - cron: "*/10 * * * *"
  workflow_dispatch:

env:
  # 変数を設定し忘れても両店舗（GIFT / BlueBell）が温まるよう、既定に両方を入れている。
  STORE_BASE_URLS: ${{ vars.STORE_BASE_URLS || 'https://kinntai-app.onrender.com https://kintai-app-bluebell.onrender.com' }}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health check
        run: |
          for base in $STORE_BASE_URLS; do
            base="${base%/}"
            echo -n "$base -> "
            curl -fsSL -o /dev/null -w "HTTP %{http_code}\n" "$base/healthz" || echo "failed"
          done
